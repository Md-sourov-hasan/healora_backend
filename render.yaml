databases:
  - name: healora-postgres
    databaseName: healora
    user: healora
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: healora-hub-backend
    runtime: docker
    repo: https://github.com/Md-sourov-hasan/healora_backend
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:render
    healthCheckPath: /docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_DOCS
        value: on
      - key: REQUIRE_MFA_FOR_PRIVILEGED
        value: "true"
      - key: AUTH_DEV_TOKENS
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: IDENTIFIER_HASH_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healora-postgres
          property: connectionString
